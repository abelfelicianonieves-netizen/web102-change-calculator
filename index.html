<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Piece of Pizza</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
<link rel="stylesheet" href="styles.css?v=2">
</head>

<body>

  <header class="pirate-header">
    <div class="pirate-logo">☠️</div>

    <div class="header-title">
      <h2>ONE PIECE OF PIZZA</h2>
      <p>Change Calculator</p>
    </div>

    <div class="pirate-message">
      PIRATES EAT PIZZA<br>
      AND MAKE CHANGE!
    </div>

    <div class="pizza-icon">🍕</div>
  </header>

  <main class="container">

    <!-- Required heading for automated tests -->
    <h1>Change Calculator</h1>

    <div class="pirate-layout">

      <div class="luffy-section">
        <img
          src="luffy-pizza.png"
          alt="Luffy holding pizza"
          class="luffy-image"
        >
      </div>

      <div class="pizza-box">

        <h2 class="calculator-title">
          CALCULATE YOUR CHANGE
        </h2>

        <div class="input-row">
          <label for="amount-due">💰 Amount Due:</label>
          <input
            id="amount-due"
            class="input"
            type="number"
            step="0.01"
            placeholder="0.00"
          >
        </div>

        <div class="input-row">
          <label for="amount-received">🪙 Amount Received:</label>
          <input
            id="amount-received"
            class="input"
            type="number"
            step="0.01"
            placeholder="0.00"
          >
        </div>

        <button id="calculate-change" class="calculate-button">
          🍕 CALCULATE CHANGE
        </button>

        <h2 class="change-title">
          🏴‍☠️ YOUR CHANGE
        </h2>

        <div class="change-grid">

          <div class="coin-card dollars">
            <div class="coin-icon">💵</div>
            <p id="dollars-output">0</p>
            <span>BERRIES</span>
          </div>

          <div class="coin-card quarters">
            <div class="coin-icon">🪙</div>
            <p id="quarters-output">0</p>
            <span>QUARTERS</span>
          </div>

          <div class="coin-card dimes">
            <div class="coin-icon">🪙</div>
            <p id="dimes-output">0</p>
            <span>DIMES</span>
          </div>

          <div class="coin-card nickels">
            <div class="coin-icon">🪙</div>
            <p id="nickels-output">0</p>
            <span>NICKELS</span>
          </div>

          <div class="coin-card pennies">
            <div class="coin-icon">🟤</div>
            <p id="pennies-output">0</p>
            <span>PENNIES</span>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
